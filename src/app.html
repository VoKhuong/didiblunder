<!doctype html>
<html lang="en" class="dark" data-theme="mona">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('didiblunder-theme');
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch {
          // Storage can be unavailable; keep the default `dark` class.
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />

    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="canonical" href="https://www.didiblunder.com" />

    <title>Did I Blunder - Free Chess Game Analysis</title>

    <meta name="viewport" content="width=device-width" />
    <meta
      name="description"
      content="Did I Blunder is an open-source chess analysis web app. Analyze your chess games for free by entering your PGN or importing directly from chess.com. Generate detailed reports and classify all your moves."
    />
    <meta
      name="keywords"
      content="chess analysis, free chess analysis, PGN analysis, chess.com, open-source chess, chess moves classification, chess game report"
    />

    <meta property="og:title" content="Did I Blunder - Free Chess Game Analysis" />
    <meta
      property="og:description"
      content="Did I Blunder is an open-source chess analysis web app. Analyze your chess games for free by entering your PGN or importing directly from chess.com. Generate detailed reports and classify all your moves."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.didiblunder.com" />
    <meta property="og:image" content="%sveltekit.assets%/favicon-96x96.png" />
    <meta name="twitter:title" content="Did I Blunder - Free Chess Game Analysis" />
    <meta
      name="twitter:description"
      content="Did I Blunder is an open-source chess analysis web app. Analyze your chess games for free by entering your PGN or importing directly from chess.com. Generate detailed reports and classify all your moves."
    />
    <meta name="twitter:image" content="%sveltekit.assets%/favicon-96x96.png" />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
